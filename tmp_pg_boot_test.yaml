apiVersion: v1
kind: Pod
metadata:
  name: pg-boot-test
  namespace: spf-app
spec:
  nodeSelector:
    kubernetes.io/hostname: 10.0.1.6
  tolerations:
    - key: node.kubernetes.io/route-unreachable
      operator: Exists
      effect: NoSchedule
  imagePullSecrets:
    - name: default-secret
  restartPolicy: Never
  containers:
    - name: boot
      image: swr.cn-north-4.myhuaweicloud.com/spf/postgres-pgvector:latest
      terminationMessagePath: /tmp/term.log
      env:
        - name: POSTGRES_USER
          value: spfuser
        - name: POSTGRES_PASSWORD
          value: c3LQpc6V3z3zXLMgsMNtfqG7
        - name: POSTGRES_DB
          value: payments
      command: ["/bin/sh", "-c", "export ERLANG_CRASH_DUMP=/tmp/erlang; /usr/local/bin/docker-entrypoint.sh postgres > /tmp/term.log 2>&1; echo EXIT=$? >> /tmp/term.log; sleep 3"]
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: pgdata
      persistentVolumeClaim:
        claimName: pgdata-postgres-0