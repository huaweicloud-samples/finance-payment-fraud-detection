apiVersion: v1
kind: Namespace
metadata:
  name: spf-app
  labels:
    app: spf-app
---
apiVersion: v1
kind: Secret
metadata:
  namespace: spf-app
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: "spfuser"
  POSTGRES_PASSWORD: "REPLACE_DB_PASSWORD"
  POSTGRES_DB: "payments"
---
apiVersion: v1
kind: Service
metadata:
  namespace: spf-app
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: spf-app
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      tolerations:
        - key: node.kubernetes.io/route-unreachable
          operator: Exists
          effect: NoSchedule

      containers:
        - name: postgres
          image: REPLACE_POSTGRES_IMAGE
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: csi-disk-topology
        resources:
          requests:
            storage: 20Gi
