apiVersion: v1
kind: Namespace
metadata:
  name: spf-app
  labels:
    app: spf-app
---
apiVersion: v1
kind: Secret
metadata:
  namespace: spf-app
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: "spfuser"
  POSTGRES_PASSWORD: "c3LQpc6V3z3zXLMgsMNtfqG7"
  POSTGRES_DB: "payments"
---
apiVersion: v1
kind: Service
metadata:
  namespace: spf-app
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: spf-app
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      tolerations:
        - key: node.kubernetes.io/route-unreachable
          operator: Exists
          effect: NoSchedule

      imagePullSecrets:
        - name: default-secret

      containers:
        - name: postgres
          image: swr.cn-north-4.myhuaweicloud.com/spf/postgres-pgvector:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      initContainers:
        - name: fix-pgdata
          image: swr.cn-north-4.myhuaweicloud.com/spf/postgres-pgvector:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              # 清除 EVS 云盘格式化残留的 lost+found，
              # 避免官方 postgres 镜像 entrypoint 因「目录非空」拒绝初始化
              rm -rf /var/lib/postgresql/data/lost+found
              chown -R 999:999 /var/lib/postgresql/data
              echo "fix-pgdata done"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: csi-disk-topology
        resources:
          requests:
            storage: 20Gi
