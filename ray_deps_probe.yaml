apiVersion: v1
kind: Pod
metadata:
  name: ray-deps-probe
  namespace: spf-app
spec:
  nodeSelector:
    kubernetes.io/hostname: 10.0.1.21
  tolerations:
    - key: node.kubernetes.io/route-unreachable
      operator: Exists
      effect: NoSchedule
  imagePullSecrets:
    - name: default-secret
  restartPolicy: Never
  containers:
    - name: probe
      image: swr.cn-north-4.myhuaweicloud.com/ray-cce/ray:2.42.1-py310-gpu
      terminationMessagePath: /tmp/term.log
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo '' | base64 -d > /tmp/probe.sh
          chmod +x /tmp/probe.sh
          sh /tmp/probe.sh
